# chat.conf — 常驻 LLM+TTS 服务配置（sh source 兼容，KEY=VALUE）
# 改完配置后重启对应服务：sh /mnt/data/chat/svc_llm.sh stop && ... start

# ---- 常驻 TTS（matcha-baker，全 KPU：A64+est+hifigan 常驻，2026-09-12 切换）----
# 权重 24.7MB、RTF 0.394、CPU 0.38 core·s/s；声调正确（拼音词表），多音字已修
TTS_BIN=/mnt/data/matcha/kvr_new
TTS_DIR=/mnt/data/matcha
# 注意：值含空格必须带引号——player.sh 会 sh source 本文件
TTS_ARGS="--daemon --matcha-a-kmodel=/mnt/data/matcha/matcha_A64.kmodel --matcha-est-kmodel=/mnt/data/matcha/matcha_est_g8.kmodel --matcha-kmodel=/mnt/data/matcha/hifigan128.kmodel --matcha-lexicon=/mnt/data/matcha/lexicon_poly.txt --matcha-tokens=/mnt/data/matcha/tokens.txt --matcha-acoustic=/mnt/data/matcha/matcha_ab.onnx"
TTS_ODE_STEPS=2     # Euler 步数：2 已过听感/ASR 双门（3 步无听感增益，白贵 1/3）
TTS_TB=64           # kA token 桶；句子 >64 tok 自动回退 ab.onnx（+40MB RAM）
TTS_SPEED=1.0       # 语速倍率（>1 更快）

# ---- 常驻 LLM（llmd：本项目 llama.cpp K230 fork 编的 resident daemon）----
# 模型一次加载、KV cache 跨轮保留（上下文连续）；FIFO 协议 <out>\t<n>\t<text>
LLMD=/mnt/data/kpu_llm/llmd
LLM_MODEL=/mnt/data/models/Qwen3-0.6B-Q8_0.gguf
LLM_CTX=512        # KV cache 上限（token）；装不下自动丢最老轮次
LLM_PREDICT=128     # 每轮最多生成 token 数（decode ~2.5 t/s）
# 系统提示词（空=用 llmd 内置精简版；prefill 大头在这，改这里免重编译）
LLM_SYS=你是语音助手小K，回答要简短口语化，所有数字用汉字，不说英文。用户说的"我"指用户本人；记住用户告诉你的信息。
LLM_TEMP=0.7
# prefill 物理块：64 时 KPU tile(256行) 4x 空转；256 恢复 tile 满载(compute ~155MB)
LLMD_UBATCH=256
LLM_TOP_P=0.8
LLM_TOP_K=20

# ---- 运行时目录（tmpfs，重启即清）----
RUN=/tmp/chat
# 持久日志目录（ext4，重启不丢）：chatd 流水 + 子进程崩溃取证
# （forensics_*：dmesg 尾/meminfo/ps/子进程日志尾），syslogd messages 也指这
LOG_DIR=/mnt/data/chat/logs

# ---- KPU prefill 实验开关（2026-09-13 定版：0=产品配置，纯 CPU）----
# 结论（详见 docs/03_交接书 §8）：KPU prefill 数值与通路全部打通
# （cos=0.99979，实测最快 17ms/GEMM vs CPU 35-104ms），但 1GB CMA 里
# TTS（matcha 全 KPU，常驻 ~200MB + 合成突发 ~100MB）与 stem 懒加载
# 互斥：装载 ~40 stems（CMA 剩 ~300MB）热态仅 +0~15%，且 CMA 压力下
# GNNE 间歇故障（poll status=0x80000c00）→ 静默乱码，并曾饿死 TTS
# 触发 WDT 整机复位。装满 196 stems 需 ~800MB CMA，TTS 必死。
# 未来出路：内核 CmaTotal 扩到 ~1.4GB（需烧卡）或 TTS 迁 CPU（RTF 不可
# 接受）。护栏代码已全部就位（地板+滞回自愈、失败毒化、TTS 退避 2s、
# warmup 换行修复），翻开关需 KPU_ENABLE=0 + 复核 docs/03 §8.9。
# 注：safe_run.sh 已升 v4（2026-09-14）移除 WDT feeder——咬狗瞬死真凶，
# 复位由 chatd 180s 用户态看门狗接管，详见 docs/03 §8.17。
KPU_ENABLE=0
# 常驻上限（LRU 驱逐）；懒加载按需装，地板见 KPU_LOCAL_FLOOR_MB
LLMD_LOAD_MODE=AUTO
# 常驻 stem 上限（LRU 驱逐）。110 = 实测稳定值（§8.15/8.16）：
# 150"半深"配置会因 LRU 驱逐碎片 churn 崩 nncase（load_all_data
# no device found）；190 只在 CMA 1280M 实验里短暂用过，非稳定态
KPU_CAP16=80
# KPU input headroom (0.5 = clip limit x2, int8 step x2; 1 = calib domain)
KPU_IO_SCALE=0.5
# S16 kmodel 目录（196 stems = 28 层 × 7 GEMM，M≥KPU_S16_MIN 的块才上 KPU）
KPU_S16_DIR=/mnt/data/kpu_qwen/s16b
KPUD_TRACE=
KPU_TRACE=
KPU_DAEMON=1
KPU_PRELOAD=0
# stem 懒加载 CMA 地板（MB）：撞线先 drop_caches 自愈（≤2 次，滞回 +100MB）
# 再放行，仍低则剩余 stem 永久走 CPU。550 = TTS 死保线（550+100 滞回）
KPU_LOCAL_FLOOR_MB=220
# S16 tile 最小 M：33 = M<33 的增量轮留 CPU（M=23 曾静默乱码且污染上下文；
# M≥33 大块 KPU 已多轮验证正确）。17 仅供未来逐 stem 验过后尝试
KPU_S16_MIN=17
WDT_ENABLE=1
